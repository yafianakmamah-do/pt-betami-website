<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 110" fill="none">
  <defs>
    <linearGradient id="obg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="obwash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#0ea5a4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="obglow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="obclip">
      <circle cx="55" cy="55" r="38"/>
    </clipPath>
  </defs>

  <!-- Emblem: disc foto sawit + cincin hijau-emas -->
  <circle cx="55" cy="55" r="56" fill="url(#obglow)"/>
  <circle cx="55" cy="55" r="52" fill="none" stroke="url(#obg)" stroke-width="7"/>
  <circle cx="55" cy="55" r="44" fill="none" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.6"/>
  <g clip-path="url(#obclip)">
    <image href="/images/aerial-palm-estate.jpg" x="17" y="17" width="76" height="76" preserveAspectRatio="xMidYMid slice"/>
    <rect width="76" height="76" fill="url(#obwash)"/>
  </g>
  <!-- Siluet daun sawit -->
  <g transform="translate(55,52)" fill="none" stroke="#ffffff" strokeOpacity="0.9" strokeLinecap="round">
    <path d="M0 -26 C-14 -14 -38 -8 -54 -6" strokeWidth="4"/>
    <path d="M0 -26 C14 -14 38 -8 54 -6" strokeWidth="4"/>
    <path d="M0 -18 C-16 -4 -36 10 -44 24" strokeWidth="3"/>
    <path d="M0 -18 C16 -4 36 10 44 24" strokeWidth="3"/>
    <path d="M0 -8 C-12 4 -24 18 -28 30" strokeWidth="2.4"/>
    <path d="M0 -8 C12 4 24 18 28 30" strokeWidth="2.4"/>
    <path d="M0 0 L-5 26 C-6 31 -2 35 0 35 C2 35 6 31 5 26 Z" fill="#f59e0b" stroke="#b45309" strokeWidth="1.5"/>
    <circle cx="0" cy="16" r="4.5" fill="#fef3c7" stroke="none"/>
  </g>

  <!-- Wordmark -->
  <text x="112" y="50" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="800" letter-spacing="1" fill="#0f766e">PT BETAMI</text>
  <text x="114" y="70" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2.5" fill="#b45309">AGRIBISNIS KELAPA SAWIT</text>
</svg>
