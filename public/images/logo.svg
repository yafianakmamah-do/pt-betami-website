<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" fill="none">
  <defs>
    <linearGradient id="lgLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="55%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="lgGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="lgRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0ea5a4"/>
    </linearGradient>
  </defs>
  <!-- emblem -->
  <g transform="translate(8,8)">
    <circle cx="40" cy="40" r="36" fill="url(#lgRing)" opacity="0.12"/>
    <circle cx="40" cy="40" r="32" stroke="url(#lgRing)" stroke-width="3" fill="none"/>
    <!-- palm fronds -->
    <path d="M40 18 C34 24 22 28 14 30" stroke="url(#lgLeaf)" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M40 18 C46 24 58 28 66 30" stroke="url(#lgLeaf)" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M40 22 C30 28 20 36 16 44" stroke="#10b981" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M40 22 C50 28 60 36 64 44" stroke="#10b981" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M40 28 C34 34 28 42 26 50" stroke="#34d399" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M40 28 C46 34 52 42 54 50" stroke="#34d399" stroke-width="2.2" stroke-linecap="round"/>
    <!-- trunk / drop base -->
    <path d="M40 36 L36 58 C35 61 37 64 40 64 C43 64 45 61 44 58 Z" fill="url(#lgGold)"/>
    <circle cx="40" cy="46" r="4.2" fill="#fff7ed" opacity="0.9"/>
  </g>
  <!-- wordmark -->
  <text x="96" y="48" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="1.2" fill="#0f766e">PT BETAMI</text>
  <text x="98" y="70" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="3" fill="#475569">AGRIBISNIS KELAPA SAWIT</text>
</svg>
